services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sellar
      POSTGRES_PASSWORD: sellar
      POSTGRES_DB: sellar
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sellar:sellar@postgres:5432/sellar?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: [postgres, redis]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]
